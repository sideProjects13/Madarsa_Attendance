name: Build and Distribute to Firebase

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks-out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Node.js v20 (Required by latest Firebase CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Grants execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Decodes the keystore
      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "Keystore secret found. Decoding..."
          keystore_path="${{ runner.temp }}/keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > $keystore_path
          echo "keystore_path=$keystore_path" >> $GITHUB_OUTPUT

      # 6. Builds a SIGNED release APK
      - name: Build with Gradle
        if: steps.decode_keystore.outcome == 'success'
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 7. Authenticates with Google Cloud
      - name: Authenticate with Google Cloud
        if: steps.decode_keystore.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}

      # ===================================================================================
      # 8. FINAL & BULLETPROOF: Distribute App AND Update Remote Config
      # This is one single script. If any command fails, the whole step fails.
      # ===================================================================================
      - name: Distribute and Update Remote Config
        if: steps.decode_keystore.outcome == 'success'
        run: |
          set -e # This command ensures that the script will exit immediately if any command fails.

          echo "Step 1: Installing latest Firebase CLI..."
          npm install -g firebase-tools@latest

          echo "Step 2: Distributing to Firebase App Distribution..."
          # We capture the output to extract the URL later
          DISTRIBUTION_OUTPUT=$(firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes-file "release_notes.txt" \
            --groups "qa-testers")
          echo "Distribution successful."

          echo "Step 3: Extracting the update URL..."
          UPDATE_URL=$(echo "$DISTRIBUTION_OUTPUT" | grep "Share this release" | grep -o 'https://appdistribution[^ ]*')

          if [ -z "$UPDATE_URL" ]; then
            echo "::error::CRITICAL: Could not find the 'Share this release' URL in the command output."
            echo "Full output was:"
            echo "$DISTRIBUTION_OUTPUT"
            exit 1 # Explicitly fail
          fi
          echo "Successfully extracted Update URL: $UPDATE_URL"

          echo "Step 4: Parsing version info from Gradle..."
          LATEST_VERSION_CODE=$(awk '/versionCode =/ {print $3}' app/build.gradle.kts)
          LATEST_VERSION_NAME=$(awk -F'"' '/versionName =/ {print $2}' app/build.gradle.kts)
          UPDATE_NOTES=$(cat release_notes.txt || echo "New update available.")
          echo "Version Code: $LATEST_VERSION_CODE | Version Name: $LATEST_VERSION_NAME"

          echo "Step 5: Creating Firebase config files..."
          # Create firebase.json required by the deploy command
          echo '{"remoteconfig": {"template": "remoteconfig.template.json"}}' > firebase.json

          # Create the remoteconfig.template.json file with the new version info
          jq -n \
            --arg code "$LATEST_VERSION_CODE" \
            --arg name "$LATEST_VERSION_NAME" \
            --arg notes "$UPDATE_NOTES" \
            --arg url "$UPDATE_URL" \
            '{
              "parameters": {
                "latest_version_code": {"defaultValue": {"value": $code}},
                "latest_version_name": {"defaultValue": {"value": $name}},
                "update_notes": {"defaultValue": {"value": $notes}},
                "update_url": {"defaultValue": {"value": $url}}
              }
            }' > remoteconfig.template.json
          echo "Firebase config files created successfully."

          echo "Step 6: Publishing updated configuration to Firebase Remote Config..."
          # If this command fails, the 'set -e' at the top will cause the script to exit with an error.
          firebase deploy --only remoteconfig --project ${{ secrets.FIREBASE_PROJECT_ID }}

          echo "✅ Remote Config published successfully! Workflow complete."