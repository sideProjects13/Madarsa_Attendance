name: Build and Distribute to Firebase

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks-out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Node.js (needed to install Firebase CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Grants execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Decodes the keystore
      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "Keystore secret found. Decoding..."
          keystore_path="${{ runner.temp }}/keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > $keystore_path
          echo "keystore_path=$keystore_path" >> $GITHUB_OUTPUT

      # 6. Builds a SIGNED release APK
      - name: Build with Gradle
        if: steps.decode_keystore.outcome == 'success'
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 7. Authenticates with Google Cloud
      - name: Authenticate with Google Cloud
        if: steps.decode_keystore.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}

      # ===================================================================================
      # 8. FINAL & BULLETPROOF: Distribute App and Update Remote Config
      # This single step captures the output directly, avoiding all previous errors.
      # ===================================================================================
      - name: Distribute and Update Remote Config
        if: steps.decode_keystore.outcome == 'success'
        run: |
          echo "Installing Firebase CLI and running distribution..."
          npm install -g firebase-tools
          
          # Run the distribution command and capture ALL of its output into a variable.
          DISTRIBUTION_OUTPUT=$(firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes-file "release_notes.txt" \
            --groups "qa-testers")

          # Check if the distribution command itself failed
          if [ $? -ne 0 ]; then
            echo "::error::Firebase App Distribution command failed."
            echo "$DISTRIBUTION_OUTPUT"
            exit 1
          fi

          echo "Distribution successful. Full output:"
          echo "$DISTRIBUTION_OUTPUT"

          # This is the new, robust way to get the URL. We search the text for the link.
          # We look for the line containing "Firebase App Distribution URL" and then extract the URL.
          UPDATE_URL=$(echo "$DISTRIBUTION_OUTPUT" | grep "Firebase App Distribution URL" | awk '{print $5}')

          if [ -z "$UPDATE_URL" ]; then
            echo "::error::Could not find the 'Firebase App Distribution URL' in the command output. The output format from Firebase might have changed."
            exit 1
          fi
          
          echo "Successfully extracted Update URL: $UPDATE_URL"

          # Use robust awk parsing for version info
          LATEST_VERSION_CODE=$(awk '/versionCode / {print $2}' app/build.gradle.kts)
          LATEST_VERSION_NAME=$(awk -F'"' '/versionName / {print $2}' app/build.gradle.kts)
          UPDATE_NOTES=$(cat release_notes.txt || true)
          
          echo "Version Code: $LATEST_VERSION_CODE | Version Name: $LATEST_VERSION_NAME"

          # Create the temporary config file for Remote Config
          echo "{" > temp_config.json
          echo "  \"parameters\": {" >> temp_config.json
          echo "    \"latest_version_code\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_CODE\"}}," >> temp_config.json
          echo "    \"latest_version_name\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_NAME\"}}," >> temp_config.json
          echo "    \"update_notes\": {\"defaultValue\": {\"value\": \"$UPDATE_NOTES\"}}," >> temp_config.json
          echo "    \"update_url\": {\"defaultValue\": {\"value\": \"$UPDATE_URL\"}}" >> temp_config.json
          echo "  }" >> temp_config.json
          echo "}" >> temp_config.json

          echo "Publishing updated configuration to Firebase Remote Config..."
          firebase remoteconfig:publish --project ${{ secrets.FIREBASE_PROJECT_ID }} --source temp_config.json -f

          echo "Remote Config published successfully!"