name: Build and Distribute to Firebase

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks-out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. NEW: Setup Node.js (needed to install Firebase CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Grants execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Decodes the keystore. THIS IS THE NEW, ROBUST METHOD.
      - name: Decode Keystore
        id: decode_keystore
        # We assign the secret to an environment variable first.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        # THEN, we check the environment variable. This avoids the parser error.
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "Keystore secret found. Decoding..."
          keystore_path="${{ runner.temp }}/keystore.jks"
          # Use the environment variable in the run command.
          echo "$KEYSTORE_B64" | base64 --decode > $keystore_path
          echo "keystore_path=$keystore_path" >> $GITHUB_OUTPUT

      # 6. Builds a SIGNED release APK.
      # This step now checks if the "Decode Keystore" step SUCCEEDED.
      - name: Build with Gradle
        if: steps.decode_keystore.outcome == 'success'
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 7. Authenticates with Google Cloud.
      # This step also only runs if the keystore was decoded successfully.
      - name: Authenticate with Google Cloud
        if: steps.decode_keystore.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}

      # 8. Uploads the signed APK to Firebase App Distribution.
      # This final step also depends on the keystore step's success.
      # I have updated the release notes to use the dedicated release_notes.txt file.
      - name: Upload artifact to Firebase App Distribution
        if: steps.decode_keystore.outcome == 'success'
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes-file "release_notes.txt" \
            --groups "qa-testers"

      # ===================================================================================
      # 9. NEW: AUTOMATICALLY UPDATE FIREBASE REMOTE CONFIG
      # This step runs after the APK is successfully distributed.
      # ===================================================================================
      - name: Update Firebase Remote Config
        if: steps.decode_keystore.outcome == 'success'
        run: |
          echo "Updating Remote Config..."
          # The Firebase CLI is already installed from the previous step.

          # Get the version code and name directly from the Gradle file
          # This is robust and avoids hardcoding them.
          LATEST_VERSION_CODE=$(grep "versionCode " app/build.gradle.kts | sed 's/.*versionCode //')
          LATEST_VERSION_NAME=$(grep "versionName " app/build.gradle.kts | sed 's/.*versionName "//' | sed 's/"//')

          echo "Latest Version Code: $LATEST_VERSION_CODE"
          echo "Latest Version Name: $LATEST_VERSION_NAME"

          # Read the release notes from the text file you created in your project
          # The "|| true" prevents the workflow from failing if the file is empty
          UPDATE_NOTES=$(cat release_notes.txt || true)

          # Get the latest release from App Distribution and extract its download link
          # This requires jq, a command-line JSON processor, which is pre-installed on GitHub runners
          echo "Fetching latest release from App Distribution..."
          LATEST_RELEASE_JSON=$(firebase appdistribution:releases:list ${{ secrets.FIREBASE_APP_ID }} --json)
          # We get the first item ([0]) in the JSON array and extract its 'firebaseConsoleUri'
          UPDATE_URL=$(echo "$LATEST_RELEASE_JSON" | jq -r '.[0].firebaseConsoleUri')

          if [ -z "$UPDATE_URL" ] || [ "$UPDATE_URL" == "null" ]; then
            echo "::error::Failed to get update URL from App Distribution."
            exit 1
          fi

          echo "Update URL: $UPDATE_URL"

          # Create a temporary JSON file with the new config values
          echo "{" > temp_config.json
          echo "  \"parameters\": {" >> temp_config.json
          echo "    \"latest_version_code\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_CODE\"}}," >> temp_config.json
          echo "    \"latest_version_name\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_NAME\"}}," >> temp_config.json
          echo "    \"update_notes\": {\"defaultValue\": {\"value\": \"$UPDATE_NOTES\"}}," >> temp_config.json
          echo "    \"update_url\": {\"defaultValue\": {\"value\": \"$UPDATE_URL\"}}" >> temp_config.json
          echo "  }" >> temp_config.json
          echo "}" >> temp_config.json

          echo "Temporary config file created:"
          cat temp_config.json

          # Import and publish the new config to your Firebase project
          # The "-f" flag forces the publish without an interactive prompt
          firebase remoteconfig:publish --project ${{ secrets.FIREBASE_PROJECT_ID }} --source temp_config.json -f

          echo "Remote Config published successfully!"