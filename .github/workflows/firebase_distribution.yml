name: Build and Distribute to Firebase

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks-out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Grants execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Decodes the keystore
      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "Keystore secret found. Decoding..."
          keystore_path="${{ runner.temp }}/keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > $keystore_path
          echo "keystore_path=$keystore_path" >> $GITHUB_OUTPUT

      # 6. Builds a SIGNED release APK
      - name: Build with Gradle
        if: steps.decode_keystore.outcome == 'success'
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # ===================================================================================
      # 7. DISTRIBUTE APP AND UPDATE REMOTE CONFIG (NEW ATOMIC APPROACH)
      # ===================================================================================

      # Step 7a: Upload to Firebase App Distribution and CAPTURE the output
      # We give this step an ID so we can use its output in the next step.
      - name: Upload to Firebase App Distribution
        if: steps.decode_keystore.outcome == 'success'
        id: distribute_app
        uses: wzieba/firebase-app-distribution-github-action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: qa-testers
          releaseNotesFile: release_notes.txt
          file: app/build/outputs/apk/release/app-release.apk

      # Step 7b: Use the output from the step above to update Remote Config
      - name: Update Firebase Remote Config
        if: steps.decode_keystore.outcome == 'success' && steps.distribute_app.outcome == 'success'
        run: |
          echo "Step 1: Installing Firebase CLI..."
          npm install -g firebase-tools

          # Step 2: Get version info from Gradle (this part is already working)
          echo "Step 2: Parsing version info from Gradle..."
          LATEST_VERSION_CODE=$(awk '/versionCode =/ {print $3}' app/build.gradle.kts)
          LATEST_VERSION_NAME=$(awk -F'"' '/versionName =/ {print $2}' app/build.gradle.kts)
          UPDATE_NOTES=$(cat release_notes.txt || echo "New update available.")
          echo "Version Code: $LATEST_VERSION_CODE | Version Name: $LATEST_VERSION_NAME"

          # Step 3: Extract the URL from the PREVIOUS step's output. This is the robust method.
          echo "Step 3: Extracting the update URL from distribution output..."
          # The action provides the full JSON response in this output variable. We use jq to parse it.
          UPDATE_URL=$(echo '${{ steps.distribute_app.outputs.FIREBASE_APP_DISTRO_RELEASE }}' | jq -r '.firebaseConsoleUri')

          if [ -z "$UPDATE_URL" ] || [ "$UPDATE_URL" == "null" ]; then
            echo "::error::CRITICAL: Could not parse the update URL from the distribution action's output."
            exit 1
          fi
          echo "Successfully extracted Update URL: $UPDATE_URL"

          # Step 4: Create the Remote Config file
          echo "Step 4: Creating temporary config file..."
          echo "{" > temp_config.json
          echo "  \"parameters\": {" >> temp_config.json
          echo "    \"latest_version_code\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_CODE\"}}," >> temp_config.json
          echo "    \"latest_version_name\": {\"defaultValue\": {\"value\": \"$LATEST_VERSION_NAME\"}}," >> temp_config.json
          echo "    \"update_notes\": {\"defaultValue\": {\"value\": \"$UPDATE_NOTES\"}}," >> temp_config.json
          echo "    \"update_url\": {\"defaultValue\": {\"value\": \"$UPDATE_URL\"}}" >> temp_config.json
          echo "  }" >> temp_config.json
          echo "}" >> temp_config.json
          
          # Step 5: Publish the config to Firebase. THIS IS THE CORRECTED COMMAND WITH NO FLAGS.
          # When run with a service account token, it is non-interactive by default.
          echo "Step 5: Publishing updated configuration to Firebase Remote Config..."
          firebase remoteconfig:publish temp_config.json --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}

          if [ $? -ne 0 ]; then
            echo "::error::Failed to publish new version to Remote Config. The app was distributed, but the in-app prompt will not work."
            exit 1
          fi

          echo "✅ Remote Config published successfully! Workflow complete."